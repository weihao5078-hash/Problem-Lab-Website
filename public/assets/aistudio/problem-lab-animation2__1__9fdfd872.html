<script>
const first=document.querySelector('.start'),last=document.querySelector('.finish'),bridge=document.querySelector('.bridge');
const blue=document.querySelector('#blue'),gold=document.querySelector('#gold');
const extras=['navy','rails','railgold'].map(id=>document.getElementById(id));
const initialBlue=[435,197,1055,197,1084,197,1084,226,1084,327,1084,356,1055,356,882,356];
const finalBlue=[483,114,705,114,802,114,802,230,802,230,802,346,705,346,483,346];
const initialGold=[426,336,186,336,162,336,150,348.67,150,374,150,507,150,545,186,545,255,545];
const finalGold=[496,330.8,496,330.8,496,330.8,496,330.8,496,330.8,496,519,496,519,520,519,814,519];
function path(v){return `M${v[0]} ${v[1]} L${v[2]} ${v[3]} Q${v[4]} ${v[5]} ${v[6]} ${v[7]} L${v[8]} ${v[9]} Q${v[10]} ${v[11]} ${v[12]} ${v[13]} L${v[14]} ${v[15]}`}
function pathGold(v,roundness){const c1x=v[2]+(v[8]-v[2])*(2/3)*roundness,c2y=v[9]-(v[9]-v[3])*(2/3)*roundness;return `M${v[0]} ${v[1]} L${v[2]} ${v[3]} C${c1x} ${v[3]} ${v[8]} ${c2y} ${v[8]} ${v[9]} L${v[10]} ${v[11]} Q${v[12]} ${v[13]} ${v[14]} ${v[15]} L${v[16]} ${v[17]}`}
const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>x*x*(3-2*x);const mix=(a,b,p)=>a.map((v,i)=>v+(b[i]-v)*p);
const hero=document.querySelector('.hero'),words=document.querySelector('.words'),rowT=words.querySelector('.title'),rowS=words.querySelector('.sub');
/* Logo mark bounds inside the 1264x712 viewBox, and its centre */
const MARK={x0:337,x1:924,y0:95,y1:539},MCX=(MARK.x0+MARK.x1)/2,MCY=(MARK.y0+MARK.y1)/2;
/* End-card sizing. The grouped logo + text is never scaled UP: MARK_MAX_H is its largest height (px)
   on any screen. It only shrinks when the hero is too small/narrow to hold it. */
const MARK_MAX_H=320,GAP_F=.13,TITLE_F=.25,FIT_W=.9,FIT_H=.5;
let L=null,cur={sh:0,r1:0,r2:0};
function layout(){
 const cs=getComputedStyle(bridge),vw=hero.clientWidth,vh=hero.clientHeight,W=parseFloat(cs.width),H=parseFloat(cs.height);
 const k=Math.min(W/1264,H/712);                 /* px per viewBox unit while the logo is full size */
 const mw=(MARK.x1-MARK.x0)*k,mh=(MARK.y1-MARK.y0)*k;
 const probe=100;rowT.style.fontSize=probe+'px';rowS.style.fontSize=probe*.5+'px';
 const tw100=Math.max(rowT.offsetWidth,rowS.offsetWidth);
 let markH=Math.min(MARK_MAX_H,vh*FIT_H);
 let s=markH/mh,markW=mw*s,fs=markH*TITLE_F,gap=markH*GAP_F,textW=tw100*fs/probe;
 const total=markW+gap+textW;
 let f=Math.min(1,vw*FIT_W/total);               /* shrink to fit narrow screens, never grow */
 if(s*f>1)f=1/s;                                  /* and never end larger than the intro logo */
 s*=f;markW*=f;fs*=f;gap*=f;textW*=f;
 rowT.style.fontSize=fs+'px';rowS.style.fontSize=fs*.5+'px';
 const left=(vw-(markW+gap+textW))/2,cx=left+markW/2,cy=vh/2;   /* group centred in the hero */
 /* element centre c; logo centre sits at c+d; transform = translate(T) scale(s) about c */
 const dx=(MCX-632)*k,dy=(MCY-356)*k;
 L={s,tx:cx-vw/2-s*dx,ty:cy-vh/2-s*dy,fs};
 words.style.transform=`translate(${left+markW+gap}px,${cy-words.offsetHeight/2}px)`;
}
function applyEnd(shrink,r1,r2){
 if(!L)layout();
 cur={sh:shrink,r1,r2};
 bridge.style.transform=`translate(${L.tx*shrink}px,${L.ty*shrink}px) scale(${1+(L.s-1)*shrink})`;
 const slide=L.fs*.5;
 rowT.style.opacity=r1;rowT.style.transform=`translateX(${-slide*(1-r1)}px)`;
 rowS.style.opacity=r2;rowS.style.transform=`translateX(${-slide*(1-r2)}px)`;
}
const relayout=()=>{layout();applyEnd(cur.sh,cur.r1,cur.r2)};
new ResizeObserver(relayout).observe(hero);
document.fonts&&document.fonts.ready.then(relayout);
let frame;
function play(){cancelAnimationFrame(frame);document.body.classList.remove('ready');const begin=performance.now();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(now){const t=(now-begin)/1000;
if(reduced){const fade=clamp((t-1.5)/.6);first.style.opacity=1-fade;last.style.opacity=0;bridge.style.opacity=fade;blue.setAttribute('d',path(finalBlue));gold.setAttribute('d',pathGold(finalGold,0));blue.setAttribute('stroke-width',30);gold.setAttribute('stroke-width',33);extras.forEach(el=>el.setAttribute('opacity',1));
 const e=clamp((t-2.1)/.6);applyEnd(e,e,e);
 if(t<2.7){frame=requestAnimationFrame(draw)}else document.body.classList.add('ready');return;}
const fade=ease(clamp((t-1.7)/.8)),morph=ease(clamp((t-2.2)/2.3));
first.style.opacity=1-fade;first.style.transform=`scale(${1-.025*fade})`;bridge.style.opacity=fade;
const goldPoints=mix(initialGold,finalGold,morph),cornerRoundness=1-ease(clamp((morph-.72)/.28));
blue.setAttribute('d',path(mix(initialBlue,finalBlue,morph)));gold.setAttribute('d',pathGold(goldPoints,cornerRoundness));
blue.setAttribute('stroke-width',18+12*morph);gold.setAttribute('stroke-width',21+12*morph);extras.forEach(el=>el.setAttribute('opacity',ease(clamp((t-3.3)/1.1))));
last.style.opacity=0;
/* end frames: hold, then logo shrinks + slides left, then the two text rows appear */
applyEnd(ease(clamp((t-5.0)/1.3)),ease(clamp((t-6.1)/.7)),ease(clamp((t-6.4)/.7)));
if(t<7.2)frame=requestAnimationFrame(draw);else document.body.classList.add('ready');}
frame=requestAnimationFrame(draw);}
document.querySelector('.replay').addEventListener('click',play);
Promise.all([...document.images].map(img=>img.decode().catch(()=>{}))).then(play);
